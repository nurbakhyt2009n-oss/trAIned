<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>trAIned · Вход</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/style.css">

<style>
/* ====== СТИЛИ ТОЛЬКО ДЛЯ ВХОДА ====== */
body{ display:grid; place-items:center; min-height:100vh; padding:24px; }
.auth-card{
  position:relative; z-index:1; width:100%; max-width:400px;
  background:var(--surface); border:1px solid var(--line-strong); border-radius:20px; padding:40px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 40px 80px -40px rgba(0,0,0,.9);
}
.auth-brand{ font-family:'Unbounded',sans-serif; font-weight:600; font-size:28px; letter-spacing:-.02em; text-align:center; }
.auth-brand .hl{ color:var(--accent); }
.auth-sub{ text-align:center; color:var(--text-mute); font-size:13px; margin-top:8px; }

.mode-tabs{ display:flex; gap:8px; margin:28px 0 22px; }
.mode-tab{
  flex:1; border:1px solid var(--line); background:var(--bg-2); color:var(--text-dim);
  padding:11px; border-radius:var(--radius-sm); cursor:pointer;
  font-family:'Manrope',sans-serif; font-size:14px; font-weight:500; transition:all .2s var(--ease);
}
.mode-tab.active{ border-color:var(--accent); color:var(--text); background:linear-gradient(180deg, rgba(200,168,106,.14), rgba(200,168,106,.05)); }

.auth-form{ display:flex; flex-direction:column; gap:16px; }
.auth-form .btn{ margin-top:6px; padding:15px; }
.auth-err{ display:none; padding:12px 15px; border:1px solid rgba(214,130,110,.4); background:rgba(214,130,110,.08); border-radius:var(--radius-sm); color:#E5B5A8; font-size:13px; }
.auth-err.show{ display:block; }
.auth-hint{ text-align:center; font-size:12px; color:var(--text-mute); margin-top:18px; line-height:1.6; }
.pass-wrap{ position:relative; }
.pass-wrap .input{ padding-right:48px; width:100%; }
.eye{ position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer;
  color:var(--text-mute); padding:6px; display:grid; place-items:center; border-radius:6px; }
.eye:hover{ color:var(--text); }
.rules{ display:none; flex-direction:column; gap:4px; font-size:12px; color:var(--text-mute); margin-top:2px; }
.rules.show{ display:flex; }
.rules .ok{ color:var(--good); }
.rules span::before{ content:"·"; display:inline-block; width:12px; }
.hidden{ display:none; }
</style>
</head>

<body>
<div class="auth-card">
  <div class="auth-brand">tr<span class="hl">AI</span>ned</div>
  <p class="auth-sub">Личный AI-тренер. Войди или создай аккаунт.</p>

  <div class="mode-tabs">
    <button class="mode-tab active" id="tabLogin">Вход</button>
    <button class="mode-tab" id="tabRegister">Регистрация</button>
  </div>

  <div class="auth-form">
    <div class="field">
      <span class="label">Логин</span>
      <input class="input" type="text" id="inUser" placeholder="Например: nurik_fit" autocomplete="username" autocapitalize="off" spellcheck="false">
    </div>
    <div class="field">
      <span class="label">Пароль</span>
      <div class="pass-wrap">
        <input class="input" type="password" id="inPass" placeholder="Твой пароль" autocomplete="current-password">
        <button class="eye" type="button" id="eyeBtn" title="Показать пароль" aria-label="Показать пароль">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </div>
      <div class="rules" id="rules">
        <span id="rLen">минимум 8 символов</span>
        <span id="rMix">буквы и цифры</span>
      </div>
    </div>
    <div class="field hidden" id="confirmField">
      <span class="label">Повтори пароль</span>
      <input class="input" type="password" id="inPass2" placeholder="Ещё раз" autocomplete="new-password">
    </div>
    <div class="auth-err" id="authErr"></div>
    <button class="btn" id="goBtn">Войти</button>
  </div>

  <p class="auth-hint">Твои данные видишь только ты.<br>Пароль хранится только в виде хэша — его не знает даже администратор.</p>
</div>

<script src="/app.js"></script>
<script>
/* ====== ЛОГИКА ВХОДА / РЕГИСТРАЦИИ ====== */
let mode = 'login';

// уже вошёл? — сразу в приложение
if(getToken()){ location.replace('/dashboard.html'); }

const tabL = document.getElementById('tabLogin');
const tabR = document.getElementById('tabRegister');
const goBtn = document.getElementById('goBtn');
const err = document.getElementById('authErr');

const inPass = document.getElementById('inPass');
const inPass2 = document.getElementById('inPass2');

function setMode(m){
  mode = m;
  const reg = m === 'register';
  tabL.classList.toggle('active', !reg);
  tabR.classList.toggle('active', reg);
  goBtn.textContent = reg ? 'Создать аккаунт' : 'Войти';
  document.getElementById('confirmField').classList.toggle('hidden', !reg);
  document.getElementById('rules').classList.toggle('show', reg);
  inPass.placeholder = reg ? 'Придумай пароль' : 'Твой пароль';
  inPass.autocomplete = reg ? 'new-password' : 'current-password';
  err.classList.remove('show');
  checkRules();
}

const hasLen = p => p.length >= 8;
const hasMix = p => /[A-Za-zА-Яа-яЁё]/.test(p) && /\d/.test(p);
function checkRules(){
  const p = inPass.value;
  document.getElementById('rLen').classList.toggle('ok', hasLen(p));
  document.getElementById('rMix').classList.toggle('ok', hasMix(p));
}
inPass.addEventListener('input', checkRules);

document.getElementById('eyeBtn').addEventListener('click', ()=>{
  const show = inPass.type === 'password';
  inPass.type = inPass2.type = show ? 'text' : 'password';
  document.getElementById('eyeBtn').title = show ? 'Скрыть пароль' : 'Показать пароль';
});
tabL.addEventListener('click', ()=> setMode('login'));
tabR.addEventListener('click', ()=> setMode('register'));

async function go(){
  const username = document.getElementById('inUser').value.trim();
  const password = inPass.value;
  err.classList.remove('show');

  if(!username){ return showErr('Введи логин'); }
  if(!password){ return showErr('Введи пароль'); }
  if(mode === 'register'){
    if(!/^[a-zA-Z0-9_.-]{3,30}$/.test(username)){
      return showErr('Логин: 3–30 символов, латинские буквы, цифры, точка, _ или -');
    }
    if(!hasLen(password)){ return showErr('Пароль — минимум 8 символов'); }
    if(!hasMix(password)){ return showErr('Пароль должен содержать буквы и цифры'); }
    if(password !== inPass2.value){ return showErr('Пароли не совпадают'); }
  }

  goBtn.disabled = true;
  goBtn.textContent = '…';
  try{
    const data = await apiPost('/api/auth/' + mode, { username, password });
    setToken(data.token);
    // после регистрации — на онбординг, после входа — в дашборд
    location.replace(mode === 'register' ? '/' : '/dashboard.html');
  }catch(e){
    showErr(e.message || 'Что-то пошло не так');
    goBtn.disabled = false;
    goBtn.textContent = mode === 'login' ? 'Войти' : 'Создать аккаунт';
  }
}

function showErr(msg){
  err.textContent = msg;
  err.classList.add('show');
}

goBtn.addEventListener('click', go);
inPass.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') go(); });
inPass2.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') go(); });
document.getElementById('inUser').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') go(); });
</script>
</body>
</html>
